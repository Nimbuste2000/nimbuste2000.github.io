<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT Toolkit Pro - Nimbuste2000</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="navbar">
<h1>📡 OSINT Toolkit Pro</h1>
<div>Nimbuste2000 - 15 ans OSINT</div>
</nav>
<div class="container">
<div class="tabs">
<button class="tab-btn active" onclick="switchTab('home')">🏠</button>
<button class="tab-btn" onclick="switchTab('radio')">📻</button>
<button class="tab-btn" onclick="switchTab('osint')">🔍</button>
<button class="tab-btn" onclick="switchTab('portfolio')">💼</button>
</div>
<div id="home" class="tab-content active">
<h2 class="section-title">🎮 Nimbus2000 15yo</h2>
<div class="grid">
<div class="card" style="grid-column:1/-1">
<h3>Portfolio OSINT</h3>
<p>Tuner FMDX + APIs live !</p>
<a href="radio/" class="btn">🎚️ Radio Live</a>
<a href="osint/" class="btn">🔍 OSINT APIs</a>
</div>
</div>
</div>
<div id="radio" class="tab-content"><iframe src="radio/" style="width:100%;height:70vh;border:none;"></iframe></div>
<div id="osint" class="tab-content"><iframe src="osint/" style="width:100%;height:70vh;border:none;"></iframe></div>
<div id="portfolio" class="tab-content">
<h2 class="section-title">💼 Projets</h2>
<div class="grid">
<div class="card"><h3>OSINT Toolkit</h3><p>Ce site !</p></div>
<div class="card"><h3>FMDX Tuner</h3><p>400+ serveurs</p></div>
</div>
</div>
</div>
<script>
function switchTab(tab){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));document.getElementById(tab).classList.add('active');event.target.classList.add('active');}
</script>
<script src="assets/script.js"></script>
</body>
</html>
