<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🔍 OSINT APIs</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="navbar"><a href="../" style="color:#b8c5ff;"><i class="fas fa-arrow-left"></i></a><h1>🔍 OSINT Live</h1></nav><div class="container"><div class="grid"><div class="card"><h3>IP Lookup</h3><input id="ip" placeholder="8.8.8.8" style="width:100%;padding:12px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid #667eea;color:#e0e0e0;"><button class="btn" onclick="ipLookup()">Analyser</button><pre id="ipres"></pre></div><div class="card"><h3>WHOIS</h3><input id="domain" placeholder="google.com" style="width:100%;padding:12px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid #667eea;color:#e0e0e0;"><button class="btn" onclick="whois()">WHOIS</button><pre id="whoisres"></pre></div></div></div><script>
async function ipLookup(){const ip=document.getElementById('ip').value;try{const r=await fetch(`http://ip-api.com/json/${ip}?fields=status,message,country,regionName,city,isp,org,query`);const d=await r.json();document.getElementById('ipres').textContent=JSON.stringify(d,null,2);}catch(e){document.getElementById('ipres').textContent='Erreur';}}
async function whois(){const d=document.getElementById('domain').value;try{const r=await fetch(`https://api.hackertarget.com/whois/?q=${d}`);const data=await r.text();document.getElementById('whoisres').textContent=data;}catch(e){document.getElementById('whoisres').textContent='Erreur';}}
</script></body></html>
