<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>📻 Tuner FMDX</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="navbar"><a href="../" style="color:#b8c5ff;"><i class="fas fa-arrow-left"></i></a><h1>📻 FMDX Tuner</h1></nav><div class="container"><div class="card" style="grid-column:1/-1;"><h3>🎚️ Serveurs FMDX.org</h3><div id="tuner"><div id="serverList" style="max-height:400px;overflow:auto;"></div></div><audio id="player" controls style="width:100%;margin-top:1rem;"></audio><div id="status" style="color:#888;">Chargement API...</div></div></div><script>
let servers=[];async function loadServers(){try{const r=await fetch('https://servers.fmdx.org/api/');const d=await r.json();servers=d.dataset||[];document.getElementById('status').textContent=`${servers.length} serveurs !`;document.getElementById('serverList').innerHTML=servers.map((s,i)=`<div style="padding:10px;border-bottom:1px solid #333;cursor:pointer;" onclick="playServer(${i})">${s.name}<br><small>${s.desc}</small></div>`).join('');}catch(e){document.getElementById('status').textContent='Demo streams';}}
function playServer(i){const s=servers[i];document.getElementById('player').src=s.stream||'https://icecast.radiofrance.fr/franceinfo-midfi.mp3';document.getElementById('player').play();}
loadServers();
</script></body></html>
